---
workflow:
  rules:
  # Never run merge request pipelines
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
  # Only run on git.aspn.us
  - if: $CI_SERVER_HOST == "git.aspn.us"

variables:
  GIT_CLEAN_FLAGS: -xdff
  UV_INDEX: https://gitlab-ci-token:${CI_JOB_TOKEN}@git.aspn.us/api/v4/projects/94/packages/pypi/simple
  FIREHOSE_OUTPUTS_VERSION: d051b108d4c68e648ed551356ad7ddc1b76b99e1  # main, July 28, 2025
  # Specify a GIT_EDITOR so that the git merge doesn't result in the error:
  # Terminal is dumb, but EDITOR unset
  GIT_EDITOR: cat

default:
    retry:
      max: 2 # (2 retry maximum, up to 3 runs in total)
      when: runner_system_failure
      exit_codes: 128
    before_script:

        # Clone only if empty directory
        - |
            if ! [ "$(ls -A)" ]; then
                git clone $CI_REPOSITORY_URL .
            fi
        - git remote set-url origin $CI_REPOSITORY_URL
        - git --no-optional-locks fetch --prune
        - git reset --hard "$CI_COMMIT_SHA"
        - git clean "$GIT_CLEAN_FLAGS" || true

        # Set git metadata so we can create a merge commit when we merge with main.
        - export GIT_COMMITTER_NAME="$(git log -1 --pretty=%cn)"
        - export GIT_COMMITTER_EMAIL="$(git log -1 --pretty=%ce)"
        - export GIT_AUTHOR_NAME="$(git log -1 --pretty=%an)"
        - export GIT_AUTHOR_EMAIL="$(git log -1 --pretty=%ae)"

        # If this is a branch pipeline, attempt to merge with master/target branch, but keep going
        # if it fails.
        - |
            if [[ ! -z "${CI_COMMIT_BRANCH}" ]]; then
                git merge origin/"${TARGET_BRANCH:-$CI_DEFAULT_BRANCH}" || true
                git reset --hard
                git clean "$GIT_CLEAN_FLAGS"
            fi

        # Grab URL with CI token, which is of the form:
        # https://gitlab-ci-token:[MASKED]@git.aspn.us/pntos/pntos.git
        - export TOKEN_URL="$(echo $CI_REPOSITORY_URL | sed -E 's/(.*git.aspn.us\/).*/\1/g')"

        # Build docker container
        - docker pull ubuntu:24.04
        - export DOCKER_IMAGE="$LOCAL_REGISTRY_CACHE/pntos-python"
        - docker build --cache-from $DOCKER_IMAGE --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg TOKEN_URL=$TOKEN_URL -t $DOCKER_IMAGE - < Dockerfile
        - docker push $DOCKER_IMAGE

stages:
    - check
    - run
    - deploy

ruff check:
    stage: check
    tags:
        - linux-light-runner
    script:
        - docker run --rm -v $(pwd):/work -v $HOME/.ccache:/root/.cache/uv -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE "uv sync && ruff check"

ruff format:
    stage: check
    tags:
        - linux-light-runner
    script:
        # Run the formatter to see if it produces a diff.
        - docker run --rm -v $(pwd):/work -v $HOME/.ccache:/root/.cache/uv -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE "uv sync && ruff format"
        # If there's a diff, fail the stage.
        - git diff --exit-code

requirements up-to-date:
    stage: check
    tags:
        - linux-light-runner
    script:
        - docker run --rm -dit -v $(pwd):/work -v $HOME/.ccache:/root/.cache/uv --name pntos-python -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE bash
        # Generate uv.lock
        - docker exec pntos-python uv sync
        # Generate requirements*.txt files
        - docker exec pntos-python uv export --frozen --no-dev --no-hashes -o requirements-minimal.txt
        - docker exec pntos-python uv export --frozen --no-hashes -o requirements.txt
        # If there's still a diff, then there's unsynced changes; fail the job.
        - git diff --exit-code

mypy:
    stage: check
    tags:
        - linux-light-runner
    script:
        - docker run --rm -dit -v $(pwd):/work -v $HOME/.ccache:/root/.cache/uv --name pntos-python -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE bash
        - docker exec pntos-python uv sync
        - docker exec pntos-python mypy .

documentation check:
    stage: check
    tags:
        - linux-light-runner
    script:
        - docker run --rm -dit -v $(pwd):/work -v $HOME/.ccache:/root/.cache/uv --name pntos-python -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE bash
        - docker exec pntos-python uv sync
        # Build the documentation
        - docker exec -e TZ=UTC pntos-python util/build_docs.sh
    artifacts:
        expose_as: "documentation"
        paths:
        - docs/build/index.html  # must be first, expose_as links to the first entry
        - docs/build # ..but all the other files *also* need to be in the archive

link check:
    stage: check
    tags:
        - linux-light-runner
    script:
        - docker run --rm -dit -v $(pwd):/work -v $HOME/.ccache:/root/.cache/uv --name pntos-python -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE bash
        - docker exec pntos-python uv sync
        # Check external links in the documentation
        - docker exec -e TZ=UTC pntos-python sphinx-build -b linkcheck --exception-on-warning docs/ docs/build/

pip workflow check:
    stage: run
    needs: []
    tags:
        - linux-light-runner
    script:
        - docker run --rm -dit -v $(pwd):/work -v $HOME/.ccache:/root/.cache/pip --name pntos-python -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE bash
        - docker exec pntos-python python3 -m venv /work/.venv
        - docker exec pntos-python .venv/bin/pip install -v -r requirements.txt --extra-index-url=${UV_INDEX}
        # TODO: run a test?

minimal pip workflow check:
    stage: check
    tags:
        - linux-light-runner
    script:
        - docker run --rm -dit -v $(pwd):/work -v $HOME/.ccache:/root/.cache/pip --name pntos-python -e UV_INDEX=${UV_INDEX} $DOCKER_IMAGE bash
        - docker exec pntos-python python3 -m venv /work/.venv
        - docker exec pntos-python .venv/bin/pip install -v -r requirements-minimal.txt --extra-index-url=${UV_INDEX}
        - docker exec pntos-python python3 -c "import pntos.cobra; import pntos.api"

copyright year check:
    stage: check
    tags:
        - linux-light-runner
    allow_failure: true
    script:
        - (! grep --color -i "copyright.*$(( $(date +%Y) - 1 ))" $(git ls-files))

pages:
    stage: deploy
    tags: [linux-light-runner]
    before_script: []
    script:
        - rm -rf public
        - mkdir -p public
        - cp -r docs/build/* public
    needs:
        - documentation check
    only:
        - main
    artifacts:
        paths:
            - public
