[project]
name = 'pntos-python-exercises'
version = '0.1.0.dev0'
description = 'A meta package for pntOS-Python exercises.'
readme = 'README.md'
authors = [ { name = 'IS4S', email = 'pntos@is4s.com' } ]
requires-python = '>=3.10'
license = 'Apache-2.0'
license-files = [ 'LICENSE' ]

classifiers = [
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]

dependencies = [
    # analysis-scripts main branch - committed 1 May 2026
    'analysis-lcm @ git+https://git@github.com/Open-PNT/analysis-scripts.git@92ee7b01d89a4b06abb07a37c3a990e3933d9ef6#subdirectory=analysis-lcm',
    # main branch, committed 6 May 2026
    'pntos-api @ git+https://github.com/is4s/pntOS-Python.git@59229306fcc94f22fe0f58af20def55452910c1c#subdirectory=pntos-api',
    'pntos-cobra @ git+https://github.com/is4s/pntOS-Python.git@59229306fcc94f22fe0f58af20def55452910c1c#subdirectory=pntos-cobra',
    'pntos-python-datasets-lcm==0.1.0',
]

[dependency-groups]
dev = [
    'mypy==1.18.2',
    'myst-parser>=4',
    'pip>=24',
    # pntos-python-exercises/v0 branch, committed 7 May 2026
    'pntos-python-exercises-docs-data @ git+https://git@github.com/Open-PNT/navigation-data.git@f3109e4298184da69abd0f0865b1e799e972b566',
    'pytest>=8.2',
    'ruff==0.13.2',
    'sphinx>=7.3.7',
    'sphinx-design',
    'sphinx-rtd-theme>=3.0.2',
]

[tool.ruff]
format.quote-style = 'single'

[tool.mypy]
strict = true
disable_error_code = [ 'import-untyped', 'no-untyped-call' ]
warn_unreachable = true

[tool.uv]
package = false
